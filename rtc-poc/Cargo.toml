[package]
name = "p2p-rtc-poc"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
getrandom = "0.4"
p2p-sync-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
webrtc = "=0.20.5"
