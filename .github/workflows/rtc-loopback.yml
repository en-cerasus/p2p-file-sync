name: Test WebRTC signaling and DataChannel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/rtc-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build Worker and Rust probe
        shell: bash
        run: |
          npm install --prefix signaling --no-audit --no-fund
          npm --prefix signaling run check
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo build --locked --manifest-path rtc-poc/Cargo.toml
          cargo build --locked -p p2p-sync-core --bin p2p-send
      - name: Exchange data over local WebRTC
        shell: bash
        run: |
          set -euo pipefail
          (cd signaling && npx wrangler dev --ip 127.0.0.1 --port 8787) > worker.log 2>&1 &
          worker=$!
          trap 'kill "$worker" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/diagnostic.html > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/diagnostic.html > /dev/null
          room=0123456789abcdef0123456789abcdef
          timeout 45s target/rtc-test/debug/p2p-rtc-poc ws://127.0.0.1:8787/signal "$room" > peer-a.log 2>&1 &
          peer_a=$!
          sleep 1
          timeout 45s target/rtc-test/debug/p2p-rtc-poc ws://127.0.0.1:8787/signal "$room" > peer-b.log 2>&1 &
          peer_b=$!
          trap 'kill "$peer_a" "$peer_b" "$worker" 2>/dev/null || true' EXIT
          success=0
          for attempt in {1..30}; do
            if grep -q 'DataChannel pong:' peer-a.log && grep -q 'DataChannel pong:' peer-b.log; then success=1; break; fi
            sleep 1
          done
          cat peer-a.log peer-b.log
          if [ "$success" -ne 1 ]; then cat worker.log; exit 1; fi
          kill "$peer_a" "$peer_b" 2>/dev/null || true
          wait "$peer_a" "$peer_b" 2>/dev/null || true
          room=ba9876543210fedcba9876543210fedc
          timeout 50s target/rtc-test/debug/p2p-rtc-poc ws://127.0.0.1:8787/signal "$room" > native-browser.log 2>&1 &
          native_browser=$!
          trap 'kill "$native_browser" "$worker" 2>/dev/null || true' EXIT
          if ! python3 rtc-poc/tests/browser_probe.py http://127.0.0.1:8787/diagnostic.html "$room"; then
            cat native-browser.log worker.log
            exit 1
          fi
          for attempt in {1..10}; do
            if grep -q 'DataChannel pong:' native-browser.log; then break; fi
            sleep 1
          done
          cat native-browser.log
          grep -q 'DataChannel pong:' native-browser.log
          echo 'Native WebRTC probe exchanged pings with the browser diagnostic page'
          kill "$native_browser" 2>/dev/null || true
          wait "$native_browser" 2>/dev/null || true
          python3 -u rtc-poc/tests/echo.py server 2 > echo-server.log 2>&1 &
          echo_server=$!
          sleep 1
          room=fedcba9876543210fedcba9876543210
          printf '{"signal_url":"ws://127.0.0.1:8787/signal","room":"%s","local_tcp":"127.0.0.1:9765","mode":"connect"}\n' "$room" > rtc-a.json
          printf '{"signal_url":"ws://127.0.0.1:8787/signal","room":"%s","local_tcp":"127.0.0.1:9865","mode":"listen"}\n' "$room" > rtc-b.json
          timeout 45s target/rtc-test/debug/p2p-send rtc-bridge rtc-a.json > tunnel-a.log 2>&1 &
          peer_a=$!
          sleep 1
          timeout 45s target/rtc-test/debug/p2p-send rtc-bridge rtc-b.json > tunnel-b.log 2>&1 &
          peer_b=$!
          trap 'kill "$peer_a" "$peer_b" "$echo_server" "$worker" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if grep -q 'RTC ready' tunnel-b.log; then break; fi
            sleep 1
          done
          if ! python3 rtc-poc/tests/echo.py client; then
            cat tunnel-a.log tunnel-b.log echo-server.log worker.log
            exit 1
          fi
          for attempt in {1..10}; do
            if grep -q 'RTC route:direct' tunnel-a.log && grep -q 'RTC route:direct' tunnel-b.log; then break; fi
            sleep 1
          done
          cat tunnel-a.log tunnel-b.log
          grep -q 'RTC route:direct' tunnel-a.log
          grep -q 'RTC route:direct' tunnel-b.log
          for attempt in {1..25}; do
            if [ "$(grep -c 'RTC ready' tunnel-a.log)" -ge 2 ] &&
               [ "$(grep -c 'RTC ready' tunnel-b.log)" -ge 2 ]; then break; fi
            sleep 1
          done
          if [ "$(grep -c 'RTC ready' tunnel-a.log)" -lt 2 ] ||
             [ "$(grep -c 'RTC ready' tunnel-b.log)" -lt 2 ]; then
            cat tunnel-a.log tunnel-b.log echo-server.log worker.log
            exit 1
          fi
          if ! python3 rtc-poc/tests/echo.py client; then
            cat tunnel-a.log tunnel-b.log echo-server.log worker.log
            exit 1
          fi
          kill "$peer_a" "$peer_b" 2>/dev/null || true
          wait "$peer_a" "$peer_b" 2>/dev/null || true
          trial=$(mktemp -d)
          target/rtc-test/debug/p2p-send setup "$trial/setup" 127.0.0.1:9766 127.0.0.1:9766
          python3 -c 'import json,sys; p=sys.argv[1]; config=json.load(open(p)); config["address"]="127.0.0.1:9866"; json.dump(config,open(p,"w"))' "$trial/setup/receiver/direct.json"
          printf 'sync through WebRTC\n' > "$trial/song.tja"
          target/rtc-test/debug/p2p-send publish "$trial/setup/sender/server.json" "$trial/sender-state" "$trial/song.tja"
          target/rtc-test/debug/p2p-send serve "$trial/setup/sender/server.json" "$trial/sender-state" > sync-server.log 2>&1 &
          sync_server=$!
          room=1234567890abcdef1234567890abcdef
          printf '{"signal_url":"ws://127.0.0.1:8787/signal","room":"%s","local_tcp":"127.0.0.1:9766","mode":"connect"}\n' "$room" > rtc-a.json
          printf '{"signal_url":"ws://127.0.0.1:8787/signal","room":"%s","local_tcp":"127.0.0.1:9866","mode":"listen"}\n' "$room" > rtc-b.json
          timeout 45s target/rtc-test/debug/p2p-send rtc-bridge rtc-a.json > sync-a.log 2>&1 &
          peer_a=$!
          sleep 1
          timeout 45s target/rtc-test/debug/p2p-send rtc-bridge rtc-b.json > sync-b.log 2>&1 &
          peer_b=$!
          trap 'kill "$peer_a" "$peer_b" "$sync_server" "$worker" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if grep -q 'RTC ready' sync-b.log; then break; fi
            sleep 1
          done
          if ! timeout 35s target/rtc-test/debug/p2p-send catch-up "$trial/setup/receiver/server.json" "$trial/receiver-state" "$trial/setup/receiver/direct.json"; then
            cat sync-a.log sync-b.log sync-server.log worker.log
            exit 1
          fi
          share=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["share"])' "$trial/setup/receiver/direct.json")
          hash=$(sha256sum "$trial/song.tja" | cut -d' ' -f1)
          cmp "$trial/song.tja" "$trial/receiver-state/$share/1/files/$hash"
          echo 'Signed event and verified file body crossed WebRTC DataChannel'
          kill "$peer_a" "$peer_b" "$sync_server" 2>/dev/null || true
          wait "$peer_a" "$peer_b" "$sync_server" 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq coturn
          turnserver -n --lt-cred-mech --user test:secret --realm p2p-test \
            --listening-ip 127.0.0.1 --relay-ip 127.0.0.1 \
            --listening-port 3478 --min-port 50000 --max-port 50050 \
            --no-tls --no-tcp --fingerprint --allow-loopback-peers \
            --cli-password testcli > turn.log 2>&1 &
          turn_server=$!
          python3 -u rtc-poc/tests/echo.py server > relay-echo.log 2>&1 &
          echo_server=$!
          trap 'kill "$peer_a" "$peer_b" "$echo_server" "$turn_server" "$worker" 2>/dev/null || true' EXIT
          sleep 2
          room=abcdef1234567890abcdef1234567890
          printf '{"signal_url":"ws://127.0.0.1:8787/signal","room":"%s","local_tcp":"127.0.0.1:9765","mode":"connect","turn_username":"test","turn_password":"secret","relay_byte_limit":10000000,"test_turn_url":"turn:127.0.0.1:3478?transport=udp","test_relay_only":true}\n' "$room" > rtc-a.json
          printf '{"signal_url":"ws://127.0.0.1:8787/signal","room":"%s","local_tcp":"127.0.0.1:9865","mode":"listen","turn_username":"test","turn_password":"secret","relay_byte_limit":10000000,"test_turn_url":"turn:127.0.0.1:3478?transport=udp","test_relay_only":true}\n' "$room" > rtc-b.json
          timeout 45s target/rtc-test/debug/p2p-send rtc-bridge rtc-a.json > relay-a.log 2>&1 &
          peer_a=$!
          sleep 1
          timeout 45s target/rtc-test/debug/p2p-send rtc-bridge rtc-b.json > relay-b.log 2>&1 &
          peer_b=$!
          for attempt in {1..25}; do
            if grep -q 'RTC ready' relay-a.log && grep -q 'RTC ready' relay-b.log; then break; fi
            sleep 1
          done
          if ! grep -q 'RTC ready' relay-a.log || ! grep -q 'RTC ready' relay-b.log ||
             ! python3 rtc-poc/tests/echo.py client; then
            cat relay-a.log relay-b.log relay-echo.log turn.log worker.log
            exit 1
          fi
          for attempt in {1..10}; do
            if grep -q 'RTC route:relay' relay-a.log && grep -q 'RTC route:relay' relay-b.log; then break; fi
            sleep 1
          done
          cat relay-a.log relay-b.log
          grep -q 'RTC route:relay' relay-a.log
          grep -q 'RTC route:relay' relay-b.log
          echo 'TURN relay transferred 100000 bytes'
          kill "$peer_a" "$peer_b" 2>/dev/null || true
          wait "$peer_a" "$peer_b" 2>/dev/null || true
          python3 -u rtc-poc/tests/echo.py server > mixed-echo.log 2>&1 &
          echo_server=$!
          room=00112233445566778899aabbccddeeff
          printf '{"signal_url":"ws://127.0.0.1:8787/signal","room":"%s","local_tcp":"127.0.0.1:9765","mode":"connect","turn_username":"test","turn_password":"secret","relay_byte_limit":10000000,"test_turn_url":"turn:127.0.0.1:3478?transport=udp"}\n' "$room" > rtc-a.json
          printf '{"signal_url":"ws://127.0.0.1:8787/signal","room":"%s","local_tcp":"127.0.0.1:9865","mode":"listen","turn_username":"test","turn_password":"secret","relay_byte_limit":10000000,"test_turn_url":"turn:127.0.0.1:3478?transport=udp"}\n' "$room" > rtc-b.json
          timeout 45s target/rtc-test/debug/p2p-send rtc-bridge rtc-a.json > mixed-a.log 2>&1 &
          peer_a=$!
          sleep 1
          timeout 45s target/rtc-test/debug/p2p-send rtc-bridge rtc-b.json > mixed-b.log 2>&1 &
          peer_b=$!
          for attempt in {1..25}; do
            if grep -q 'RTC ready' mixed-a.log && grep -q 'RTC ready' mixed-b.log; then break; fi
            sleep 1
          done
          if ! grep -q 'RTC ready' mixed-a.log || ! grep -q 'RTC ready' mixed-b.log ||
             ! python3 rtc-poc/tests/echo.py client; then
            cat mixed-a.log mixed-b.log mixed-echo.log turn.log worker.log
            exit 1
          fi
          for attempt in {1..10}; do
            if grep -q 'RTC route:direct' mixed-a.log && grep -q 'RTC route:direct' mixed-b.log; then break; fi
            sleep 1
          done
          cat mixed-a.log mixed-b.log
          grep -q 'RTC route:direct' mixed-a.log
          grep -q 'RTC route:direct' mixed-b.log
          echo 'Direct route preferred with TURN available'
          kill "$peer_a" "$peer_b" 2>/dev/null || true
          wait "$peer_a" "$peer_b" 2>/dev/null || true
          python3 -u rtc-poc/tests/echo.py server > fallback-echo.log 2>&1 &
          echo_server=$!
          # Keep the local TURN listener and its allocated relay ports working,
          # while preventing host/srflx candidates from sending to each other.
          sudo iptables -I OUTPUT 1 -p udp ! -d 127.0.0.1 -j DROP
          sudo iptables -I OUTPUT 1 -p udp --sport 3478 -j ACCEPT
          sudo iptables -I OUTPUT 1 -p udp --sport 50000:50050 -j ACCEPT
          trap 'sudo iptables -D OUTPUT -p udp --sport 50000:50050 -j ACCEPT 2>/dev/null || true; sudo iptables -D OUTPUT -p udp --sport 3478 -j ACCEPT 2>/dev/null || true; sudo iptables -D OUTPUT -p udp ! -d 127.0.0.1 -j DROP 2>/dev/null || true; kill "$peer_a" "$peer_b" "$echo_server" "$turn_server" "$worker" 2>/dev/null || true' EXIT
          room=ffeeddccbbaa99887766554433221100
          printf '{"signal_url":"ws://127.0.0.1:8787/signal","room":"%s","local_tcp":"127.0.0.1:9765","mode":"connect","turn_username":"test","turn_password":"secret","relay_byte_limit":10000000,"test_turn_url":"turn:127.0.0.1:3478?transport=udp"}\n' "$room" > rtc-a.json
          printf '{"signal_url":"ws://127.0.0.1:8787/signal","room":"%s","local_tcp":"127.0.0.1:9865","mode":"listen","turn_username":"test","turn_password":"secret","relay_byte_limit":10000000,"test_turn_url":"turn:127.0.0.1:3478?transport=udp"}\n' "$room" > rtc-b.json
          timeout 45s target/rtc-test/debug/p2p-send rtc-bridge rtc-a.json > fallback-a.log 2>&1 &
          peer_a=$!
          sleep 1
          timeout 45s target/rtc-test/debug/p2p-send rtc-bridge rtc-b.json > fallback-b.log 2>&1 &
          peer_b=$!
          for attempt in {1..25}; do
            if grep -q 'RTC ready' fallback-a.log && grep -q 'RTC ready' fallback-b.log; then break; fi
            sleep 1
          done
          if ! grep -q 'RTC ready' fallback-a.log || ! grep -q 'RTC ready' fallback-b.log ||
             ! python3 rtc-poc/tests/echo.py client; then
            cat fallback-a.log fallback-b.log fallback-echo.log turn.log worker.log
            exit 1
          fi
          for attempt in {1..10}; do
            if grep -q 'RTC route:relay' fallback-a.log && grep -q 'RTC route:relay' fallback-b.log; then break; fi
            sleep 1
          done
          cat fallback-a.log fallback-b.log
          grep -q 'RTC route:relay' fallback-a.log
          grep -q 'RTC route:relay' fallback-b.log
          echo 'TURN fallback transferred 100000 bytes when direct UDP was blocked'
