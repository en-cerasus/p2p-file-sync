name: Test and build Windows client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Test Rust and build both Windows components
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          cargo test --locked --workspace
          cargo build --locked --release -p p2p-sync-core --lib
          cargo build --locked --release -p p2p-sync-core --bin p2p-send
          dotnet build windows/P2PSync.csproj --configuration Release
          Copy-Item target/release/p2p-send.exe windows/bin/Release/net10.0-windows/
          if (-not (Test-Path 'windows/bin/Release/net10.0-windows/P2PSync.exe')) {
            throw 'Windows GUI executable was not produced.'
          }
          if (-not (Test-Path 'windows/bin/Release/net10.0-windows/p2p_sync_core.dll')) {
            throw 'Rust core DLL was not copied beside the GUI.'
          }
          if (-not (Test-Path 'windows/bin/Release/net10.0-windows/p2p-send.exe')) {
            throw 'Manual setup command was not included beside the GUI.'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: P2PSync-Windows
          path: windows/bin/Release/net10.0-windows/
          if-no-files-found: error
