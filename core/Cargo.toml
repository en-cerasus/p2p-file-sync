[package]
name = "p2p-sync-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "p2p_sync_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
sha2 = "0.10.9"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
tempfile = "3.27"
unicode-normalization = "0.1.26"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
getrandom = "0.4"
ed25519-dalek = "2.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

serde_json = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
time = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Wdk_Storage_FileSystem"] }
