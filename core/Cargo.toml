[package]
name = "p2p-sync-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "p2p_sync_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
sha2 = "0.10.9"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
tempfile = "3.27"
